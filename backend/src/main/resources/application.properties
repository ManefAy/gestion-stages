# ===== Application =====
spring.application.name=backend
server.port=8080

# ===== MySQL connection =====
spring.datasource.url=jdbc:mysql://localhost:3306/devtec_stages
spring.datasource.username=root
# The password is NOT here: it's in application-local.properties (ignored by Git)

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Load the local secrets file =====
# "optional:" = don't crash if the file is missing (it gives a clear DB error instead)
spring.config.import=optional:classpath:application-local.properties